---
http:
  routers:
    adguard-doh:
      rule: "Host(`dns.jstockley.com`) && (Path(`/dns-query`) || PathPrefix(`/dns-query/`))"
      entryPoints:
        - websecure
      priority: 100
      service: adguard-doh
      tls: {}

  services:
    adguard-doh:
      loadBalancer:
        passHostHeader: true
        serversTransport: adguard-tls
        servers:
          - url: "https://adguard:443"

  serversTransports:
    adguard-tls:
      serverName: dns.jstockley.com
      insecureSkipVerify: false
