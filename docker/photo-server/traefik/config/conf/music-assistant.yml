---
http:
  routers:
    music-assistant:
      rule: "Host(`music.jstockley.com`) || Host(`music.local.jstockley.com`)"
      entryPoints:
        - websecure
      service: music-assistant
      tls:
        certResolver: production
  services:
    music-assistant:
      loadBalancer:
        servers:
          - url: "http://192.168.1.119:8095"
