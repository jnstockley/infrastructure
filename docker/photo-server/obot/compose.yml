---
name: obot
services:
  obot:
    image: ghcr.io/obot-platform/obot:v0.26.2
    container_name: obot
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OBOT_SERVER_ENABLE_AUTHENTICATION=true
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.obot.entrypoints=websecure
      - traefik.http.routers.obot.rule=Host(`ai.local.jstockley.com`)
      - traefik.http.routers.obot.tls=true
      - traefik.http.routers.obot.tls.certresolver=production
      - traefik.http.routers.obot.service=obot
      - traefik.http.services.obot.loadbalancer.server.port=8080
      - traefik.docker.network=proxy

networks:
  proxy:
    name: proxy
    external: true
    enable_ipv4: true
    enable_ipv6: true
