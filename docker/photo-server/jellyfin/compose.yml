---
name: jellyfin
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: /mnt/media
        target: /media
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.local.jstockley.com
    ports:
      - '0.0.0.0:7359:7359/udp'  # Client auto-discovery
      - '0.0.0.0:1900:1900/udp'  # DLNA auto-discovery
    networks:
      - proxy
    restart: 'unless-stopped'
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.local.jstockley.com`)
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=production
      - traefik.http.routers.jellyfin.service=jellyfin
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - traefik.docker.network=proxy
    user: 1000:1000

networks:
  proxy:
    name: proxy
    external: true
    enable_ipv4: true
    enable_ipv6: true
