---
name: jellyfin
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: /mnt/media
        target: /media
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.local.jstockley.com
    # Host networking is required so UDP discovery replies (port 7359/1900)
    # leave with the host's real IP as source, instead of being dropped by
    # Docker's NAT when the original request was sent to a broadcast address.
    network_mode: host
    restart: 'unless-stopped'
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.local.jstockley.com`)
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=production
      - traefik.http.routers.jellyfin.service=jellyfin
      # Explicit URL needed since host networking means Traefik can't
      # auto-detect the container's address on the "proxy" network.
      - traefik.http.services.jellyfin.loadbalancer.server.url=http://host.docker.internal:8096
    user: 1000:1000

  upscaler:
    image: kuscheltier/jellyfin-ai-upscaler:v1.8.3.30
    container_name: jellyfin-ai-upscaler
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ai-models:/app/models

volumes:
  ai-models:
