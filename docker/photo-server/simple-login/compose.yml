---
x-simplelogin-common: &simplelogin-common
  image: simplelogin/app-ci:v4.78.9
  env_file:
    - .env
  environment:
    - TZ=America/Chicago
  volumes:
    - ./dkim/dkim.key:/dkim.key:ro
    - ./data/pgp:/sl/pgp
    - ./data/upload:/code/static/upload
  networks:
    - proxy
    - private
  security_opt:
    - no-new-privileges:true
name: simplelogin

services:

  email-handler:
    container_name: simplelogin-email-handler
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["python", "email_handler.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 20381), 3)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=false
    <<: *simplelogin-common
    security_opt:
      - no-new-privileges:true

  init:
    container_name: simplelogin-init
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "init_app.py"]
    restart: "no"
    <<: *simplelogin-common

  job-runner:
    container_name: simplelogin-job-runner
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["python", "job_runner.py"]
    restart: unless-stopped
    labels:
      - traefik.enable=false
    <<: *simplelogin-common
    security_opt:
      - no-new-privileges:true
  migrate:
    container_name: simplelogin-migrate
    command:
      - bash
      - -c
      - |
        until (echo > /dev/tcp/${DB_HOST}/${DB_PORT}) 2>/dev/null; do
          echo "waiting for postgres at ${DB_HOST}:${DB_PORT}..."
          sleep 2
        done
        alembic upgrade head
    restart: "no"
    <<: *simplelogin-common

  postfix:
    image: simplelogin/postfix:4.2.3
    container_name: simplelogin-postfix
    depends_on:
      - email-handler
      - postfix-certs
    volumes:
      - ./data/certs:/certs:ro
    environment:
      - TZ=America/Chicago
      - SIMPLELOGIN_COMPATIBILITY_MODE=v4
    env_file:
      - .env
    ports:
      - '0.0.0.0:25:25'
    networks:
      - proxy
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/sbin/postfix", "status"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=false
    security_opt:
      - no-new-privileges:true

  # ── Mail transfer agent ─────────────────────────────────────────────────────
  postfix-certs:
    image: ldez/traefik-certs-dumper:v2.11.2
    container_name: simplelogin-postfix-certs
    volumes:
      # ADJUST: point this at the acme.json used by your existing Traefik stack.
      - ../traefik/config/certs/acme.json:/traefik-acme/acme.json:ro
      - ./data/certs:/output
    network_mode: "none"
    command:
      - file
      - --version=v3
      - --domain-subdir
      - --watch
      - --source=/traefik-acme/acme.json
      - --dest=/output
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── Long-running services ───────────────────────────────────────────────────
  webapp:
    container_name: simplelogin-webapp
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7777/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.simplelogin.entrypoints=websecure
      - traefik.http.routers.simplelogin.rule=Host(`simplelogin.jstockley.com`)
      - traefik.http.routers.simplelogin.tls=true
      - traefik.http.routers.simplelogin.tls.certresolver=production
      - traefik.http.routers.simplelogin.service=simplelogin
      - traefik.http.services.simplelogin.loadbalancer.server.port=7777
      - traefik.docker.network=proxy
    <<: *simplelogin-common
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    name: proxy
    external: true
    enable_ipv4: true
    enable_ipv6: true
  private:
    name: private
    internal: true
    external: true
    enable_ipv4: true
    enable_ipv6: true
