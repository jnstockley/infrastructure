---
name: unifi-mcp
services:
  unifi-mcp:
    image: ghcr.io/enuno/unifi-mcp-server:0.6.4
    container_name: unifi-mcp
    environment:
      UNIFI_API_TYPE: local
      UNIFI_LOCAL_HOST: unifi.local.jstockley.com
      UNIFI_LOCAL_VERIFY_SSL: true
      MCP_SERVER_TRANSPORT: streamable_http
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 2
    env_file:
      - .env
    networks:
      - private
      - bridge

networks:
  bridge:
  private:
    name: private
    internal: true
    external: true
    enable_ipv4: true
    enable_ipv6: true
