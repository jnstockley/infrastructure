---
name: bitwarden-lite
services:
  bitwarden:
    image: ghcr.io/bitwarden/lite:2026.8.1
    container_name: bitwarden
    volumes:
      - ./data:/etc/bitwarden
    env_file:
      - .env
    networks:
      - proxy
      - private
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.bw.entrypoints=websecure
      - traefik.http.routers.bw.rule=Host(`vault.jstockley.com`)
      - traefik.http.routers.bw.tls=true
      - traefik.http.routers.bw.tls.certresolver=production
      - traefik.http.routers.bw.service=bw
      - traefik.http.services.bw.loadbalancer.server.port=8080
      - traefik.docker.network=proxy


networks:
  proxy:
    name: proxy
    external: true
    enable_ipv4: true
    enable_ipv6: true
  private:
    name: private
    internal: true
    external: true
    enable_ipv4: true
    enable_ipv6: true
