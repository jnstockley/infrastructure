---
name: simplelogin
services:

  app:
    image: simplelogin/app-ci:v4.81.7
    container_name: sl-app
    volumes:
      - ./data:/sl
      - ./data/upload:/code/static/upload
      - ./.env:/code/.env:ro
      - ./dkim/dkim.key:/dkim.key:ro
      - ./dkim/dkim.pub.key:/dkim.pub.key:ro
    env_file: .env
    networks:
      - sl-network
      - proxy
      - private
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.simplelogin.rule=Host(`mail.jstockley.com`)"
      - "traefik.http.routers.simplelogin.entrypoints=websecure"
      - "traefik.http.routers.simplelogin.tls.certresolver=letsencrypt"
      - "traefik.http.services.simplelogin.loadbalancer.server.port=7777"

  email:
    image: simplelogin/app-ci:v4.81.7
    container_name: sl-email
    volumes:
      - ./data:/sl
      - ./data/upload:/code/static/upload
      - ./.env:/code/.env:ro
      - ./dkim/dkim.key:/dkim.key:ro
      - ./dkim/dkim.pub.key:/dkim.pub.key:ro
    env_file: .env
    # Published to localhost ONLY: native Postfix relays inbound mail to
    # this port (see postfix/pgsql-transport-maps.cf -> smtp:127.0.0.1:20381)
    ports:
      - '127.0.0.1:20381:20381'
    networks:
      - sl-network
    command: ["python", "email_handler.py"]
    restart: unless-stopped

  init:
    image: simplelogin/app-ci:v4.81.7
    container_name: sl-init
    volumes:
      - ./data:/sl
      - ./.env:/code/.env:ro
      - ./dkim/dkim.key:/dkim.key:ro
      - ./dkim/dkim.pub.key:/dkim.pub.key:ro
    env_file: .env
    networks:
      - sl-network
    command: ["python", "init_app.py"]
    profiles: ["tools"]  # only runs when explicitly invoked, not on `up`

  job-runner:
    image: simplelogin/app-ci:v4.81.7
    container_name: sl-job-runner
    volumes:
      - ./data:/sl
      - ./data/upload:/code/static/upload
      - ./.env:/code/.env:ro
      - ./dkim/dkim.key:/dkim.key:ro
      - ./dkim/dkim.pub.key:/dkim.pub.key:ro
    env_file: .env
    networks:
      - sl-network
    command: ["python", "job_runner.py"]
    restart: unless-stopped
  migration:
    image: simplelogin/app-ci:v4.81.7
    container_name: sl-migration
    volumes:
      - ./data:/sl
      - ./data/upload:/code/static/upload
      - ./dkim/dkim.key:/dkim.key:ro
      - ./dkim/dkim.pub.key:/dkim.pub.key:ro
      - ./.env:/code/.env:ro
    env_file: .env
    networks:
      - sl-network
      - private
    command: ["flask", "db", "upgrade"]
    profiles: ["tools"]  # only runs when explicitly invoked, not on `up`

networks:
  # Fixed subnet so native Postfix can trust this range in mynetworks
  # (see postfix/main.cf) and so containers can reach the host's Postfix
  # at the gateway IP (10.0.0.1) to relay outbound mail.
  sl-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1
  proxy:
    name: proxy
    external: true
    enable_ipv4: true
    enable_ipv6: true
  # External network shared with the `postgres` stack (docker/racknerd/postgres)
  # so these containers can reach the `postgres` container directly by name.
  private:
    name: private
    external: true
    enable_ipv4: true
    enable_ipv6: true
