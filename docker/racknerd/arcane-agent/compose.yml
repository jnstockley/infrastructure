---
name: arcane-agent
services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v2.17.2
    container_name: arcane-agent
    depends_on:
      - tailscale
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /home/jackstockley/infrastructure/docker/racknerd:/app/data/projects
    environment:
      EDGE_AGENT: "true"
      EDGE_TRANSPORT: "poll"
      MANAGER_API_URL: "http://arcane-manager-photo-server.tail5bef84.ts.net:3552"
      HTTP_PROXY: "http://tailscale:1055"
      NO_PROXY: "localhost,127.0.0.1"
      TZ: "America/Chicago"
      PUID: 1000
      PGID: 1000
    env_file:
      - .env
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: ts-agent-host
    volumes:
      - ts-state:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_HOSTNAME=arcane-agent-racknerd
      - TS_EXTRA_ARGS=--ssh=false --accept-dns=true
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=0.0.0.0:1055
    env_file:
      - .env
    restart: unless-stopped

volumes:
  ts-state:
