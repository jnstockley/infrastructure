name: Renovate

# Only needed if you're NOT using the hosted Renovate GitHub App
# (https://github.com/apps/renovate). If you installed that app on this
# repo instead, delete this file — it would just run Renovate twice.

on:
  schedule:
    - cron: "0 5 * * 1" # matches renovate.json's "before 6am on monday"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v41.0.5
        with:
          configurationFile: renovate.json
          token: "${{ secrets.RENOVATE_TOKEN }}"
        env:
          # Lets Renovate's containerbase install a real `nix` binary to run
          # `nix flake update` / lock-file maintenance with. No manual setup
          # needed — this happens automatically inside the job.
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: "${{ github.repository }}"

# RENOVATE_TOKEN: a GitHub personal access token (classic or fine-grained)
# with `contents: write` and `pull-requests: write` on this repo, added as
# a repo secret. The default GITHUB_TOKEN also works if you'd rather not
# create a PAT, but PRs it opens won't trigger other workflows.
