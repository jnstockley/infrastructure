name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # macos-14 is Apple Silicon (aarch64), matching the aarch64-darwin
    # systems this flake actually targets.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Check formatting + lints (nixfmt, statix, deadnix)
        run: nix flake check
